<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://use.typekit.net/fph7wsm.css">
        <title>what is thought is embodied</title>
    </head>

    <style>

        body {
            background-color: rgb(0, 0, 0)
        }

        p {
            font-family: "parfumerie-script", sans-serif;
            font-weight: 400;
            font-size: 350%;
            text-align: center;
            color: rgb(0, 0, 0);
            line-height: 0.9;
        }

        #mantra {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 17%;  
        }

        #date {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 77%;  
        }

        #doily {
            width: 600px;
            position: absolute;
            inset: 0;
            place-self: center;
            mix-blend-mode: screen ;
            opacity: 45%;
        }

        #image1 {
            width: 400px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 15%;      
        }

        #image2 {
            width: 400px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 55%;  
        }

        #image3 {
            width: 250px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 47%;  
            mix-blend-mode: multiply;
            opacity: 90%;
        }

    </style>

    <body>
        <img id="image1" src="images/image1.JPG">
        <img id="image2" src="images/image2.JPG">
        <img id="image3" src="images/image3.jpg">
        <img id="doily" src="images/doily1.jpg">

        <p id="mantra">What is<br>Thought is<br>Embodied</p>
        <p id="date">October 2026</p>
    </body>

</html>
